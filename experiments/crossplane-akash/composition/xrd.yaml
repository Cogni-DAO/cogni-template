# XRD — the ONLY net-new API this spike introduces (this + the Composition).
# XAkashWorkload exposes the spawn-facing fields that mirror the operator's
# compute provision body (DeclaredProvisionSpec / ProvisionSpec).
#
# scope: Cluster (Crossplane v2, no claim) — chosen so we compose the *cluster*
# provider-http Request (http.crossplane.io/v1alpha2) and the cluster ProviderConfig
# (http.crossplane.io/v1alpha1), which is the exact group every upstream provider-http
# example uses. (A Namespaced XR would need the http.m.crossplane.io namespaced
# Request variant; that portability is orthogonal to the thesis.)
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xakashworkloads.compute.cogni.io
spec:
  scope: Cluster
  group: compute.cogni.io
  names:
    kind: XAkashWorkload
    plural: xakashworkloads
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [nodeId, publicHost, services]
              properties:
                # Logical workload identity. The operator enforces one paid
                # workload per node/env; this is the key the server dedupes on,
                # which is what makes a re-issued create crash-safe.
                nodeId:
                  type: string
                  description: Stable workload identity (uuid in the real CRD).
                # Public hostname the workload is served on (maps to the public
                # service's ingress host in the Akash SDL).
                publicHost:
                  type: string
                # Optional pointer to the provider-http ProviderConfig carrying
                # the operator bearer token. Defaults to the one demo.sh installs.
                providerConfigName:
                  type: string
                  default: operator-compute
                services:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, image, cpuUnits, memoryMi, storageMi, port, visibility]
                    properties:
                      name:
                        type: string
                      image:
                        type: string
                        description: Fully-qualified OCI ref (digest-pinned in prod).
                      cpuUnits:
                        type: number
                      memoryMi:
                        type: integer
                      storageMi:
                        type: integer
                      port:
                        type: integer
                      visibility:
                        type: string
                        enum: [public, private]
            status:
              type: object
              properties:
                leaseId:
                  type: string
                  description: The opaque lease handle (dseq) captured from provision.
                state:
                  type: string
                endpoints:
                  type: array
                  items:
                    type: string
