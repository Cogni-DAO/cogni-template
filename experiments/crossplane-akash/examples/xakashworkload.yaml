# Sample workload declaration — the git CR a spawning agent would commit.
# Mirrors the operator provision body: one public node-app service on Akash.
apiVersion: compute.cogni.io/v1alpha1
kind: XAkashWorkload
metadata:
  name: demo-node-app
spec:
  nodeId: 11111111-1111-1111-1111-111111111111
  publicHost: demo-node.example.com
  providerConfigName: operator-compute
  services:
    - name: app
      image: ghcr.io/cogni-dao/node-app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      cpuUnits: 0.5
      memoryMi: 512
      storageMi: 1024
      port: 3000
      visibility: public
