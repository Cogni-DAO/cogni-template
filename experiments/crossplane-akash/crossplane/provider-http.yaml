# crossplane-contrib/provider-http — the GENERIC reconcile engine.
# It knows nothing about Akash; it drives an arbitrary HTTP API declared by a
# Request CR. Pinned to a released version so the spike is reproducible.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-http
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-http:v1.0.15
  # Fast crash/adopt demo: the DeploymentRuntimeConfig shrinks the poll interval
  # so the kill-mid-create + drift steps re-reconcile in seconds.
  runtimeConfigRef:
    name: provider-http-fast
