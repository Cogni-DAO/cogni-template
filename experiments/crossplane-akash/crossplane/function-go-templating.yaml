# The Composition Function used by the Composition's Pipeline. Crossplane v2 removed
# the native "Resources" composition mode, so a function is required to render the
# composed provider-http Request. go-templating lets us build the JSON POST body
# from the XR fields naturally. Pinned for reproducibility.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-go-templating:v0.12.4
