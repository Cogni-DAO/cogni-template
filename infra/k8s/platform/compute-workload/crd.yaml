apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: computeworkloads.compute.cogni.io
  annotations:
    # Removing a child Application must never garbage-collect durable handles/finalizers.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  group: compute.cogni.io
  scope: Namespaced
  names:
    plural: computeworkloads
    singular: computeworkload
    kind: ComputeWorkload
    shortNames: [cwl]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Desired
          type: integer
          jsonPath: .status.desiredGeneration
        - name: Observed
          type: integer
          jsonPath: .status.observedGeneration
        - name: Source
          type: string
          jsonPath: .status.sourceSha
        - name: Resource
          type: string
          jsonPath: .status.resource.id
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required:
                - nodeId
                - environment
                - sourceSha
                - artifactDigests
                - workload
              properties:
                nodeId:
                  type: string
                  format: uuid
                environment:
                  type: string
                  minLength: 1
                  maxLength: 63
                sourceSha:
                  type: string
                  pattern: "^[0-9a-f]{40}$"
                artifactDigests:
                  type: object
                  minProperties: 1
                  additionalProperties:
                    type: string
                    pattern: "^sha256:[0-9a-f]{64}$"
                workload:
                  type: object
                  required: [name, services]
                  properties:
                    name:
                      type: string
                      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                    services:
                      type: array
                      minItems: 1
                      maxItems: 8
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required:
                          - name
                          - image
                          - cpuUnits
                          - memoryMi
                          - storageMi
                        properties:
                          name:
                            type: string
                            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                          image:
                            type: string
                            pattern: "^.+@sha256:[0-9a-f]{64}$"
                          command:
                            type: array
                            maxItems: 64
                            items: { type: string }
                          args:
                            type: array
                            maxItems: 64
                            items: { type: string }
                          env:
                            description: Non-secret service bindings and runtime configuration only.
                            type: object
                            maxProperties: 64
                            additionalProperties:
                              type: string
                              maxLength: 4096
                          cpuUnits:
                            type: number
                            exclusiveMinimum: true
                            minimum: 0
                          memoryMi:
                            type: integer
                            minimum: 1
                          storageMi:
                            type: integer
                            minimum: 1
                          expose:
                            type: array
                            items:
                              type: object
                              required: [port, as, global]
                              properties:
                                port:
                                  type: integer
                                  minimum: 1
                                  maximum: 65535
                                as:
                                  type: integer
                                  minimum: 1
                                  maximum: 65535
                                global: { type: boolean }
                                hosts:
                                  type: array
                                  maxItems: 16
                                  items: { type: string, minLength: 1 }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
