apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: compute-workload-platform
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/cogni-dao/cogni.git
    targetRevision: deploy/candidate-a-operator
    # Candidate flight materializes infra/k8s/base/** onto the deploy branch.
    # Keep this child target inside that existing authority; do not grow workflow copy logic.
    path: infra/k8s/base/compute-workload-platform
  destination: { server: https://kubernetes.default.svc, namespace: argocd }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
