#
# One-time source half of the candidate-a deployment-parent cutover. The job
# binds only four GitHub-environment-custodied flight credentials. Runtime and
# generated values remain in OpenBao and are forbidden by the reviewed
# manifest. The target mutator is deliberately a separate local ceremony.
#
# GitHub only enables workflow_dispatch after this file exists on the default
# branch. Merging this workflow prepares the lever; it does not run it.
name: Candidate-a sealed authority export

run-name: Seal minimal candidate-a authority for fixed test parent

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type cogni-test-org/cogni-monorepo:candidate-a
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-a-sealed-authority-export
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    environment: candidate-a
    timeout-minutes: 10
    steps:
      - name: Require the fixed source and target
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$GITHUB_REPOSITORY" != "cogni-dao/cogni" ]; then
            echo "::error::export must run in the fixed canonical repository"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::export must be dispatched from main"
            exit 1
          fi
          if [ "$CONFIRMATION" != "cogni-test-org/cogni-monorepo:candidate-a" ]; then
            echo "::error::confirmation does not name the fixed target"
            exit 1
          fi

      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          ref: main

      - name: Verify the reviewed default-branch revision
        run: |
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error::checked-out main revision does not match the dispatch revision"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/ci/sealed-secret-transfer/package-lock.json

      - name: Install pinned sealing dependency
        working-directory: scripts/ci/sealed-secret-transfer
        run: npm ci --ignore-scripts --workspaces=false

      - name: Seal minimal candidate authority manifest
        env:
          SOURCE_SECRET_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_SECRET_CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SOURCE_SECRET_SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          SOURCE_SECRET_VM_HOST: ${{ secrets.VM_HOST }}
          SOURCE_VARIABLE_DOMAIN: ${{ vars.DOMAIN }}
          SEALED_BUNDLE_OUTPUT: candidate-a-sealed-authority.json
        run: node scripts/ci/sealed-secret-transfer/seal.mjs

      - name: Upload secret-ciphertext and explicit non-secret config
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-a-sealed-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-a-sealed-authority.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
