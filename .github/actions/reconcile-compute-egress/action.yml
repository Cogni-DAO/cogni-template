name: Reconcile External Compute Egress
description: Apply the complete catalog-derived environment allowlist through the existing VM hardener.

inputs:
  app_source_root:
    {
      required: true,
      description: "Absolute reviewed application source checkout",
    }
  environment:
    { required: true, description: "candidate-a, preview, or production" }
  vm_host: { required: true, description: "Environment substrate VM host" }
  ssh_deploy_key:
    { required: true, description: "Existing environment SSH deployment key" }

runs:
  using: composite
  steps:
    - name: Render complete environment allowlist
      shell: bash
      env:
        APP_SOURCE_ROOT: ${{ inputs.app_source_root }}
        DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        ALLOWLIST: ${{ runner.temp }}/compute-egress-allowlist
      run: |
        set -euo pipefail
        COGNI_CATALOG_ROOT="${APP_SOURCE_ROOT}/infra/catalog" \
          bash "${APP_SOURCE_ROOT}/scripts/ci/render-compute-egress-allowlist.sh" \
            "$DEPLOYMENT_ENVIRONMENT" > "$ALLOWLIST"

    - name: Reconcile environment substrate firewall
      shell: bash
      env:
        APP_SOURCE_ROOT: ${{ inputs.app_source_root }}
        VM_HOST: ${{ inputs.vm_host }}
        SSH_DEPLOY_KEY: ${{ inputs.ssh_deploy_key }}
        ALLOWLIST: ${{ runner.temp }}/compute-egress-allowlist
      run: |
        set -euo pipefail
        [ -n "$VM_HOST" ] || { echo "::error::VM_HOST is required for external compute egress"; exit 1; }
        [ -n "$SSH_DEPLOY_KEY" ] || { echo "::error::SSH_DEPLOY_KEY is required for external compute egress"; exit 1; }

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$SSH_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -T 10 -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

        # The concurrency group on the calling job serializes these canonical
        # staging paths per environment. The existing hardener atomically installs
        # the complete render and converges removals as well as additions.
        remote_allowlist=/tmp/compute-egress-allowlist
        remote_hardener=/tmp/harden-docker-public-ports.sh
        source "${APP_SOURCE_ROOT}/scripts/ci/lib/ssh-retry.sh"
        ssh_opts=(
          -i ~/.ssh/deploy_key
          -o StrictHostKeyChecking=accept-new
          -o ConnectTimeout=30
          -o ServerAliveInterval=10
          -o ServerAliveCountMax=6
        )
        ci_ssh_retry scp "${ssh_opts[@]}" \
          "$ALLOWLIST" "root@${VM_HOST}:${remote_allowlist}"
        ci_ssh_retry scp "${ssh_opts[@]}" \
          "${APP_SOURCE_ROOT}/infra/provision/cherry/harden-docker-public-ports.sh" \
          "root@${VM_HOST}:${remote_hardener}"
        ci_ssh_retry ssh "${ssh_opts[@]}" "root@${VM_HOST}" \
          "status=0; STAGED_ALLOWLIST='${remote_allowlist}' bash '${remote_hardener}' || status=\$?; rm -f '${remote_allowlist}' '${remote_hardener}'; exit \$status"
