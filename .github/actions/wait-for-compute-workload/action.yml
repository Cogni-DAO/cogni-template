name: Wait for ComputeWorkload
description: Read-only gate for exact Git-rendered external workload readiness.

inputs:
  app_source_root:
    { required: true, description: "Application source checkout" }
  manifest: { required: true, description: "Expected ComputeWorkload manifest" }
  vm_host: { required: true, description: "Environment control-plane host" }
  ssh_identity: { required: true, description: "SSH identity file" }
  # Must exceed the controller's own allocation budget, not the post-boot cutover
  # window: one attempt is bidTimeout (90s) + bootSlo (300s) before the on-chain
  # tx, DNS reconcile and source verify, and the controller retries providers.
  timeout_seconds:
    { required: false, default: "900", description: "Readiness wait budget" }

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "22"

    - name: Wait for exact ComputeWorkload generation
      shell: bash
      working-directory: ${{ inputs.app_source_root }}
      env:
        EXPECTED_MANIFEST: ${{ inputs.manifest }}
        VM_HOST: ${{ inputs.vm_host }}
        SSH_IDENTITY: ${{ inputs.ssh_identity }}
        TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
      run: |
        set -euo pipefail
        command -v yq >/dev/null || {
          echo "::error::yq is required to read the ComputeWorkload manifest"
          exit 1
        }
        expected_json="${RUNNER_TEMP}/expected-compute-workload.json"
        yq -o=json '.' "$EXPECTED_MANIFEST" > "$expected_json"
        node --experimental-strip-types \
          --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
          nodes/operator/app/scripts/wait-for-compute-workload-ready.ts \
          --manifest-json "$expected_json" \
          --host "$VM_HOST" \
          --identity "$SSH_IDENTITY" \
          --timeout-seconds "$TIMEOUT_SECONDS"
